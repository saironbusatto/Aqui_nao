name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.git*' --exclude='.github' --exclude='CLAUDE.md' --exclude='credenciais.md' --exclude='README.md' --exclude='__pycache__' --exclude='.pytest_cache' --exclude='.coverage'
          path: ./
          remote_path: /home/ubuntu/aqui-nao/
          remote_host: ${{ secrets.ORACLE_HOST }}
          remote_user: ${{ secrets.ORACLE_USER }}
          remote_key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /home/ubuntu/aqui-nao
            docker-compose down && docker-compose up -d
